<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — FitTrack Pro</title>
<link rel="stylesheet" href="css/style.css">
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;padding:2rem 1rem;background:var(--bg-primary)}
.auth-bg{position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 70% 50%,rgba(244,80,30,0.06),transparent);pointer-events:none}
.auth-container{width:100%;max-width:460px;margin:0 auto}
.auth-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;margin-top:5rem}
.auth-logo{text-align:center;margin-bottom:2rem}
.auth-logo a{font-family:var(--font-display);font-size:2rem;letter-spacing:2px;text-decoration:none;color:inherit}
.auth-logo span{color:var(--accent)}
.auth-title{font-family:var(--font-display);font-size:2.2rem;letter-spacing:1px;text-align:center;margin-bottom:0.5rem}
.auth-sub{text-align:center;color:var(--text-secondary);font-size:0.9rem;margin-bottom:2rem}
</style>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="nav-logo">FIT<span>TRACK</span></a>
  <div class="nav-actions">
    <a href="login.html" class="btn btn-primary btn-sm">Log In</a>
  </div>
</nav>
<div class="auth-bg"></div>
<div class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo"><a href="index.html">FIT<span>TRACK</span></a></div>
      <h1 class="auth-title">FORGOT PASSWORD</h1>
      <p class="auth-sub">Enter your email and we'll send you a one-time code to reset your password.</p>
      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="forgotEmail" name="email" class="form-control"
                   placeholder="your@email.com" required>
          </div>
          <div class="form-error" id="forgotError"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="forgotBtn">
          <span id="forgotBtnText">Send Reset OTP</span>
          <span class="spinner hidden" id="forgotSpinner"></span>
        </button>
      </form>
      <div style="text-align:center;margin-top:1.2rem;font-size:0.85rem;color:var(--text-secondary)">
        Remembered it? <a href="login.html" style="color:var(--accent)">Back to Login</a>
      </div>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
